<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="corezanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0070F3"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B214A"/>
      <stop offset="100%" stop-color="#051129"/>
    </linearGradient>
  </defs>
  <!-- Background Shield -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="#0070F3" stroke-opacity="0.35" stroke-width="1.5"/>
  
  <!-- Outer Hexagonal Mesh Accent -->
  <polygon points="32,10 50,21 50,43 32,54 14,43 14,21" stroke="url(#corezanGrad)" stroke-width="3" stroke-linejoin="round" fill="none" opacity="0.9"/>
  
  <!-- Inner Neural Core / Orbital Node -->
  <circle cx="32" cy="32" r="7" fill="url(#corezanGrad)"/>
  <circle cx="32" cy="32" r="12" stroke="#00D2FF" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8"/>
  
  <!-- Node Vertices -->
  <circle cx="32" cy="10" r="2.5" fill="#00D2FF"/>
  <circle cx="50" cy="21" r="2.5" fill="#00D2FF"/>
  <circle cx="50" cy="43" r="2.5" fill="#00D2FF"/>
  <circle cx="32" cy="54" r="2.5" fill="#00D2FF"/>
  <circle cx="14" cy="43" r="2.5" fill="#00D2FF"/>
  <circle cx="14" cy="21" r="2.5" fill="#00D2FF"/>
</svg>

<section class="modules-section" id="modules">
  <div class="page-width">
    <div class="section-heading centered-heading">
      <span class="eyebrow">The ZARO solutions</span>
      <h2>ZARO Featured Industry Modules</h2>
      <p>Built-in functional modules precision-engineered for diverse private and public sector domains.</p>
    </div>
    <div class="module-grid">
      @for (module of modules; track module[1]) {
        <a class="module-card" href="#contact" [class.custom-module]="module[1] === 'Custom Domain'">
          <span class="module-icon" aria-hidden="true">{{ module[0] }}</span><span>{{ module[1] }}</span>
        </a>
      }
    </div>
  </div>
</section>
